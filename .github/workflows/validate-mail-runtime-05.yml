name: Validate mail runtime 0.5

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/mail-runtime-0.5.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mail-runtime-0.5.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration when pending
        shell: bash
        run: |
          if [ -f tools/apply_mail_runtime_05.py ]; then
            python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_mail_runtime_05.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              're.subn(pattern, replacement, text, count=1, flags=re.DOTALL)',
              're.subn(pattern, lambda _match: replacement, text, count=1, flags=re.DOTALL)',
          )
          path.write_text(text, encoding='utf-8')
          PY
            python tools/apply_mail_runtime_05.py
          else
            echo "Integration already persisted"
          fi
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate final product state
        run: |
          python -m pytest -q
          python -m compileall -q apps packages connectors
          node --check apps/web/app.js
          git diff --check
      - name: Persist integration after green tests
        shell: bash
        run: |
          if [ ! -f tools/apply_mail_runtime_05.py ]; then
            echo "Nothing to persist"
            exit 0
          fi
          rm -f tools/apply_mail_runtime_05.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire approved delivery and mail intelligence"
          git push origin HEAD:feat/mail-runtime-0.5.0
