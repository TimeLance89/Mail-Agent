name: Refine 0.13.8

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attention-auto-mail-handling-0.13.8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply refinements
        run: python tools/run_refine_0138.py
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: reconcile processed mail and surface shadow attention"
          git push origin HEAD:feat/attention-auto-mail-handling-0.13.8
