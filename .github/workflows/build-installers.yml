name: Build installers

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -e . pyinstaller
      - name: Build standalone app
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Mail-Agent
          --paths apps/launcher --paths apps/gateway --paths apps/registry --paths packages/agent_core
          --paths connectors/imap --paths connectors/google --paths connectors/microsoft
          --add-data "apps/web:mail_agent_web"
          apps/launcher/mail_agent_launcher/main.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\MailAgent.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Mail-Agent-Windows-Installer
          path: dist/installer/Mail-Agent-Setup.exe

  standalone:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Mail-Agent-Linux
          - os: macos-latest
            artifact: Mail-Agent-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pyinstaller
      - name: Build standalone app
        run: >-
          pyinstaller --noconfirm --clean --onefile
          --name Mail-Agent
          --paths apps/launcher --paths apps/gateway --paths apps/registry --paths packages/agent_core
          --paths connectors/imap --paths connectors/google --paths connectors/microsoft
          --add-data "apps/web:mail_agent_web"
          apps/launcher/mail_agent_launcher/main.py
      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/Mail-Agent-Linux-x64.tar.gz Mail-Agent
      - name: Package macOS binary
        if: runner.os == 'macOS'
        run: ditto -c -k dist/Mail-Agent dist/Mail-Agent-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Mail-Agent-Linux-x64.tar.gz
            dist/Mail-Agent-macOS.zip
          if-no-files-found: ignore

  publish-preview:
    if: github.ref == 'refs/heads/main'
    needs: [windows, standalone]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Point preview tag at current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f preview-latest "$GITHUB_SHA"
          git push origin refs/tags/preview-latest --force
      - name: Create or update direct-download preview release
        shell: bash
        run: |
          if gh release view preview-latest >/dev/null 2>&1; then
            gh release edit preview-latest \
              --title "MAIL-AGENT Preview" \
              --prerelease \
              --notes "Automatisch gebaut aus dem aktuellen main-Stand. Für Windows einfach Mail-Agent-Setup.exe herunterladen und ausführen."
          else
            gh release create preview-latest \
              --title "MAIL-AGENT Preview" \
              --prerelease \
              --notes "Automatisch gebaut aus dem aktuellen main-Stand. Für Windows einfach Mail-Agent-Setup.exe herunterladen und ausführen."
          fi
          gh release upload preview-latest release-assets/* --clobber

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
