name: Build installers

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]" pyinstaller
      - name: Sync packaged app version
        shell: python
        run: |
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          launcher = Path("apps/launcher/mail_agent_launcher/main.py")
          text = launcher.read_text(encoding="utf-8")
          text, count = re.subn(
              r'^APP_VERSION = "[^"]+"$',
              f'APP_VERSION = "{version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Could not synchronize launcher APP_VERSION")
          launcher.write_text(text, encoding="utf-8")
          installer = Path("packaging/windows/MailAgent.iss").read_text(encoding="utf-8")
          if f'#define MyAppVersion "{version}"' not in installer:
              raise SystemExit("Windows installer version does not match pyproject.toml")
          print(f"Packaging MAIL-AGENT {version}")
      - name: Embed OAuth desktop client overrides
        shell: python
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID || secrets.MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          import os
          import re
          from pathlib import Path

          target = Path("apps/gateway/mail_agent_gateway/oauth_defaults.py")
          text = target.read_text(encoding="utf-8")
          overrides = {
              "GOOGLE_CLIENT_ID": os.environ.get("GOOGLE_OAUTH_CLIENT_ID", "").strip(),
              "MICROSOFT_CLIENT_ID": os.environ.get("MICROSOFT_OAUTH_CLIENT_ID", "").strip(),
          }
          for name, value in overrides.items():
              if not value:
                  continue
              text, count = re.subn(
                  rf'^{name} = .+$',
                  f'{name} = {value!r}',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Could not embed {name}")
              print(f"Using CI-provided {name}.")
          target.write_text(text, encoding="utf-8")
      - name: Validate embedded OAuth defaults
        shell: python
        run: |
          import py_compile
          import runpy

          path = "apps/gateway/mail_agent_gateway/oauth_defaults.py"
          py_compile.compile(path, doraise=True)
          defaults = runpy.run_path(path)
          google_client_id = defaults.get("GOOGLE_CLIENT_ID", "")
          microsoft_client_id = defaults.get("MICROSOFT_CLIENT_ID", "")
          if not google_client_id.endswith(".apps.googleusercontent.com"):
              raise SystemExit("A valid Google OAuth desktop client ID is required for release builds")
          print("Google OAuth desktop client configured.")
          if microsoft_client_id:
              print("Microsoft OAuth public client configured.")
          else:
              print("Microsoft OAuth public client not embedded; Microsoft UI stays unavailable.")
      - name: Run tests
        run: python -m pytest -q
      - name: Validate source and frontend syntax
        shell: pwsh
        run: |
          python -m compileall -q apps packages connectors tests
          node --check apps/web/app.js
          node --check apps/web/desktop-links.js
          git diff --check
      - name: Build standalone app
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Mail-Agent
          --paths apps/launcher --paths apps/gateway --paths apps/registry --paths packages/agent_core
          --paths connectors/imap --paths connectors/google --paths connectors/microsoft
          --add-data "apps/web:mail_agent_web"
          --hidden-import pystray._win32
          apps/launcher/mail_agent_launcher_entry.py
      - name: Smoke test standalone app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\Mail-Agent.exe" -ArgumentList "--help" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Mail-Agent.exe smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\MailAgent.iss'
      - name: Verify installer output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\installer\Mail-Agent-Setup.exe")) {
            throw "Mail-Agent-Setup.exe was not created"
          }
          Get-Item "dist\installer\Mail-Agent-Setup.exe" | Format-List Name,Length,LastWriteTime
      - uses: actions/upload-artifact@v4
        with:
          name: Mail-Agent-Windows-Installer
          path: dist/installer/Mail-Agent-Setup.exe
          if-no-files-found: error

  publish-preview:
    if: github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Mail-Agent-Windows-Installer
          path: release-assets
      - name: Verify preview asset
        run: test -f release-assets/Mail-Agent-Setup.exe
      - name: Point preview tag at current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f preview-latest "$GITHUB_SHA"
          git push origin refs/tags/preview-latest --force
      - name: Create or update direct-download preview release
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NOTES="MAIL-AGENT Preview v${VERSION}. Automatisch gebaut aus dem aktuellen main-Stand."
          if gh release view preview-latest >/dev/null 2>&1; then
            gh release edit preview-latest \
              --title "MAIL-AGENT Preview v${VERSION}" \
              --prerelease \
              --notes "$NOTES"
          else
            gh release create preview-latest \
              --title "MAIL-AGENT Preview v${VERSION}" \
              --prerelease \
              --notes "$NOTES"
          fi
          gh release upload preview-latest release-assets/Mail-Agent-Setup.exe --clobber

  standalone:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Mail-Agent-Linux
          - os: macos-latest
            artifact: Mail-Agent-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" pyinstaller
      - name: Sync packaged app version
        shell: python
        run: |
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          launcher = Path("apps/launcher/mail_agent_launcher/main.py")
          text = launcher.read_text(encoding="utf-8")
          text, count = re.subn(
              r'^APP_VERSION = "[^"]+"$',
              f'APP_VERSION = "{version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Could not synchronize launcher APP_VERSION")
          launcher.write_text(text, encoding="utf-8")
          print(f"Packaging MAIL-AGENT {version}")
      - name: Embed OAuth desktop client overrides
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID || secrets.MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          target = Path("apps/gateway/mail_agent_gateway/oauth_defaults.py")
          text = target.read_text(encoding="utf-8")
          overrides = {
              "GOOGLE_CLIENT_ID": os.environ.get("GOOGLE_OAUTH_CLIENT_ID", "").strip(),
              "MICROSOFT_CLIENT_ID": os.environ.get("MICROSOFT_OAUTH_CLIENT_ID", "").strip(),
          }
          for name, value in overrides.items():
              if not value:
                  continue
              text, count = re.subn(
                  rf'^{name} = .+$',
                  f'{name} = {value!r}',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Could not embed {name}")
              print(f"Using CI-provided {name}.")
          target.write_text(text, encoding="utf-8")
          PY
      - name: Validate embedded OAuth defaults
        run: |
          python - <<'PY'
          import py_compile
          import runpy

          path = "apps/gateway/mail_agent_gateway/oauth_defaults.py"
          py_compile.compile(path, doraise=True)
          defaults = runpy.run_path(path)
          google_client_id = defaults.get("GOOGLE_CLIENT_ID", "")
          microsoft_client_id = defaults.get("MICROSOFT_CLIENT_ID", "")
          if not google_client_id.endswith(".apps.googleusercontent.com"):
              raise SystemExit("A valid Google OAuth desktop client ID is required for release builds")
          print("Google OAuth desktop client configured.")
          if microsoft_client_id:
              print("Microsoft OAuth public client configured.")
          else:
              print("Microsoft OAuth public client not embedded; Microsoft UI stays unavailable.")
          PY
      - name: Run tests
        run: python -m pytest -q
      - name: Validate source and frontend syntax
        run: |
          python -m compileall -q apps packages connectors tests
          node --check apps/web/app.js
          node --check apps/web/desktop-links.js
          git diff --check
      - name: Build standalone app
        run: >-
          pyinstaller --noconfirm --clean --onefile
          --name Mail-Agent
          --paths apps/launcher --paths apps/gateway --paths apps/registry --paths packages/agent_core
          --paths connectors/imap --paths connectors/google --paths connectors/microsoft
          --add-data "apps/web:mail_agent_web"
          apps/launcher/mail_agent_launcher_entry.py
      - name: Smoke test standalone app
        run: ./dist/Mail-Agent --help >/dev/null
      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/Mail-Agent-Linux-x64.tar.gz Mail-Agent
      - name: Package macOS binary
        if: runner.os == 'macOS'
        run: ditto -c -k dist/Mail-Agent dist/Mail-Agent-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Mail-Agent-Linux-x64.tar.gz
            dist/Mail-Agent-macOS.zip
          if-no-files-found: ignore
