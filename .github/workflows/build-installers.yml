name: Build installers

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]" pyinstaller
      - name: Embed Google OAuth desktop client override
        shell: python
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          import os
          from pathlib import Path

          client_id = os.environ.get("GOOGLE_OAUTH_CLIENT_ID", "").strip()
          target = Path("apps/gateway/mail_agent_gateway/oauth_defaults.py")
          if client_id:
              target.write_text(
                  '"""Build-time OAuth defaults. Environment variables override these values."""\n\n'
                  f'GOOGLE_CLIENT_ID = {client_id!r}\n',
                  encoding="utf-8",
              )
              print("Using CI-provided Google OAuth desktop client ID.")
          else:
              print("Using the packaged MAIL-AGENT Google OAuth desktop client ID.")
      - name: Validate embedded OAuth defaults
        shell: python
        run: |
          import py_compile
          import runpy

          path = "apps/gateway/mail_agent_gateway/oauth_defaults.py"
          py_compile.compile(path, doraise=True)
          client_id = runpy.run_path(path).get("GOOGLE_CLIENT_ID", "")
          if not client_id.endswith(".apps.googleusercontent.com"):
              raise SystemExit("A valid Google OAuth desktop client ID is required for release builds")
          print("Google OAuth desktop client configured.")
      - name: Run tests
        run: python -m pytest -q
      - name: Build standalone app
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Mail-Agent
          --paths apps/launcher --paths apps/gateway --paths apps/registry --paths packages/agent_core
          --paths connectors/imap --paths connectors/google --paths connectors/microsoft
          --add-data "apps/web:mail_agent_web"
          --hidden-import pystray._win32
          apps/launcher/mail_agent_launcher/main.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\MailAgent.iss'
      - name: Verify installer output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\installer\Mail-Agent-Setup.exe")) {
            throw "Mail-Agent-Setup.exe was not created"
          }
          Get-Item "dist\installer\Mail-Agent-Setup.exe" | Format-List Name,Length,LastWriteTime
      - uses: actions/upload-artifact@v4
        with:
          name: Mail-Agent-Windows-Installer
          path: dist/installer/Mail-Agent-Setup.exe
          if-no-files-found: error

  publish-preview:
    if: github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Mail-Agent-Windows-Installer
          path: release-assets
      - name: Verify preview asset
        run: test -f release-assets/Mail-Agent-Setup.exe
      - name: Point preview tag at current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f preview-latest "$GITHUB_SHA"
          git push origin refs/tags/preview-latest --force
      - name: Create or update direct-download preview release
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NOTES="MAIL-AGENT Preview v${VERSION}. Automatisch gebaut aus dem aktuellen main-Stand."
          if gh release view preview-latest >/dev/null 2>&1; then
            gh release edit preview-latest \
              --title "MAIL-AGENT Preview v${VERSION}" \
              --prerelease \
              --notes "$NOTES"
          else
            gh release create preview-latest \
              --title "MAIL-AGENT Preview v${VERSION}" \
              --prerelease \
              --notes "$NOTES"
          fi
          gh release upload preview-latest release-assets/Mail-Agent-Setup.exe --clobber

  standalone:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Mail-Agent-Linux
          - os: macos-latest
            artifact: Mail-Agent-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" pyinstaller
      - name: Embed Google OAuth desktop client override
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          client_id = os.environ.get("GOOGLE_OAUTH_CLIENT_ID", "").strip()
          target = Path("apps/gateway/mail_agent_gateway/oauth_defaults.py")
          if client_id:
              target.write_text(
                  '"""Build-time OAuth defaults. Environment variables override these values."""\n\n'
                  f'GOOGLE_CLIENT_ID = {client_id!r}\n',
                  encoding="utf-8",
              )
              print("Using CI-provided Google OAuth desktop client ID.")
          else:
              print("Using the packaged MAIL-AGENT Google OAuth desktop client ID.")
          PY
      - name: Validate embedded OAuth defaults
        run: |
          python - <<'PY'
          import py_compile
          import runpy

          path = "apps/gateway/mail_agent_gateway/oauth_defaults.py"
          py_compile.compile(path, doraise=True)
          client_id = runpy.run_path(path).get("GOOGLE_CLIENT_ID", "")
          if not client_id.endswith(".apps.googleusercontent.com"):
              raise SystemExit("A valid Google OAuth desktop client ID is required for release builds")
          print("Google OAuth desktop client configured.")
          PY
      - name: Run tests
        run: python -m pytest -q
      - name: Build standalone app
        run: >-
          pyinstaller --noconfirm --clean --onefile
          --name Mail-Agent
          --paths apps/launcher --paths apps/gateway --paths apps/registry --paths packages/agent_core
          --paths connectors/imap --paths connectors/google --paths connectors/microsoft
          --add-data "apps/web:mail_agent_web"
          apps/launcher/mail_agent_launcher/main.py
      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/Mail-Agent-Linux-x64.tar.gz Mail-Agent
      - name: Package macOS binary
        if: runner.os == 'macOS'
        run: ditto -c -k dist/Mail-Agent dist/Mail-Agent-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Mail-Agent-Linux-x64.tar.gz
            dist/Mail-Agent-macOS.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
