name: Build installers

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]" pyinstaller
      - name: Sync packaged app version
        shell: python
        run: |
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          for target_name in (
              "apps/launcher/mail_agent_launcher/main.py",
              "apps/gateway/mail_agent_gateway/main.py",
          ):
              target = Path(target_name)
              text = target.read_text(encoding="utf-8")
              text, count = re.subn(
                  r'^APP_VERSION = "[^"]+"$',
                  f'APP_VERSION = "{version}"',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Could not synchronize APP_VERSION in {target_name}")
              target.write_text(text, encoding="utf-8")
          installer = Path("packaging/windows/MailAgent.iss").read_text(encoding="utf-8")
          if f'#define MyAppVersion "{version}"' not in installer:
              raise SystemExit("Windows installer version does not match pyproject.toml")
          identity = Path("packages/agent_core/mail_agent_core/identity.py").read_text(encoding="utf-8")
          if f'app_version: str = "{version}"' not in identity:
              raise SystemExit("Agent identity version does not match pyproject.toml")
          desktop = Path("apps/web/desktop-links.js").read_text(encoding="utf-8")
          if f"const APP_VERSION = '{version}'" not in desktop:
              raise SystemExit("Desktop UI version does not match pyproject.toml")
          print(f"Packaging MAIL-AGENT {version}")
      - name: Embed OAuth desktop client overrides
        shell: python
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID || secrets.MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          import os
          import re
          from pathlib import Path

          target = Path("apps/gateway/mail_agent_gateway/oauth_defaults.py")
          text = target.read_text(encoding="utf-8")
          overrides = {
              "GOOGLE_CLIENT_ID": os.environ.get("GOOGLE_OAUTH_CLIENT_ID", "").strip(),
              "MICROSOFT_CLIENT_ID": os.environ.get("MICROSOFT_OAUTH_CLIENT_ID", "").strip(),
          }
          for name, value in overrides.items():
              if not value:
                  continue
              text, count = re.subn(
                  rf'^{name} = .+$',
                  f'{name} = {value!r}',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Could not embed {name}")
              print(f"Using CI-provided {name}.")
          target.write_text(text, encoding="utf-8")
      - name: Validate embedded OAuth defaults
        shell: python
        run: |
          import py_compile
          import runpy

          path = "apps/gateway/mail_agent_gateway/oauth_defaults.py"
          py_compile.compile(path, doraise=True)
          defaults = runpy.run_path(path)
          google_client_id = defaults.get("GOOGLE_CLIENT_ID", "")
          microsoft_client_id = defaults.get("MICROSOFT_CLIENT_ID", "")
          if not google_client_id.endswith(".apps.googleusercontent.com"):
              raise SystemExit("A valid Google OAuth desktop client ID is required for release builds")
          print("Google OAuth desktop client configured.")
          if microsoft_client_id:
              print("Microsoft OAuth public client configured.")
          else:
              print("Microsoft OAuth public client not embedded; Microsoft UI stays unavailable.")
      - name: Run tests
        run: python -m pytest -q
      - name: Validate source and frontend syntax
        shell: pwsh
        run: |
          python -m compileall -q apps packages connectors tests
          node --check apps/web/app.js
          node --check apps/web/llm-model-settings-v2.js
          node --check apps/web/desktop-links.js
          git diff --check
      - name: Build standalone app
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Mail-Agent
          --paths apps/launcher --paths apps/gateway --paths apps/registry --paths packages/agent_core
          --paths connectors/imap --paths connectors/google --paths connectors/microsoft
          --add-data "apps/web:mail_agent_web"
          --hidden-import pystray._win32
          apps/launcher/mail_agent_launcher_entry.py
      - name: Smoke test standalone app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\Mail-Agent.exe" -ArgumentList "--help" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Mail-Agent.exe smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Smoke test bundled web UI after stale updater environment
        shell: pwsh
        run: |
          $expectedVersion = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          $dataDir = Join-Path $env:RUNNER_TEMP "mail-agent-web-smoke"
          Remove-Item $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          $env:MAIL_AGENT_WEB_DIR = Join-Path $env:RUNNER_TEMP "stale-old-meipass\mail_agent_web"
          $process = Start-Process -FilePath "dist\Mail-Agent.exe" -ArgumentList @("--no-browser", "--data-dir", $dataDir) -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            $healthy = $false
            do {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 1
                if ($health.service -eq "mail-agent-gateway" -and $health.version -eq $expectedVersion) {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            if (-not $healthy) {
              throw "Frozen MAIL-AGENT gateway did not become healthy as $expectedVersion"
            }
            $root = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -TimeoutSec 5 -UseBasicParsing
            if ($root.StatusCode -ne 200 -or $root.Content -notmatch "<title>MAIL-AGENT</title>") {
              throw "Frozen MAIL-AGENT did not serve the bundled web UI at /"
            }
          } finally {
            if ($process -and -not $process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
            }
            Remove-Item Env:MAIL_AGENT_WEB_DIR -ErrorAction SilentlyContinue
          }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\MailAgent.iss'
      - name: Verify installer output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\installer\Mail-Agent-Setup.exe")) {
            throw "Mail-Agent-Setup.exe was not created"
          }
          Get-Item "dist\installer\Mail-Agent-Setup.exe" | Format-List Name,Length,LastWriteTime
      - uses: actions/upload-artifact@v4
        with:
          name: Mail-Agent-Windows-Installer
          path: dist/installer/Mail-Agent-Setup.exe
          if-no-files-found: error

  publish-preview:
    if: github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Mail-Agent-Windows-Installer
          path: release-assets
      - name: Verify preview asset
        run: test -f release-assets/Mail-Agent-Setup.exe
      - name: Publish and verify direct-download preview release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NOTES="MAIL-AGENT Preview v${VERSION}. Automatisch gebaut und verifiziert aus dem aktuellen main-Stand."
          INSTALLER="release-assets/Mail-Agent-Setup.exe"
          EXPECTED_SHA256=$(sha256sum "$INSTALLER" | awk '{print $1}')

          if ! gh release view preview-latest >/dev/null 2>&1; then
            PREVIOUS_SHA=$(git rev-parse "${GITHUB_SHA}^")
            git tag -f preview-latest "$PREVIOUS_SHA"
            git push origin refs/tags/preview-latest --force
            gh release create preview-latest \
              --verify-tag \
              --title "MAIL-AGENT Preview" \
              --prerelease \
              --notes "MAIL-AGENT Preview-Kanal."
          fi

          mkdir -p release-backup
          gh release download preview-latest \
            --pattern "Mail-Agent-Setup.exe" \
            --dir release-backup \
            --clobber >/dev/null 2>&1 || true

          restore_previous_asset() {
            if [[ -f release-backup/Mail-Agent-Setup.exe ]]; then
              echo "Restoring previous verified preview installer."
              gh release upload preview-latest release-backup/Mail-Agent-Setup.exe --clobber || true
            fi
          }

          if ! gh release upload preview-latest "$INSTALLER" --clobber; then
            restore_previous_asset
            exit 1
          fi

          rm -rf release-verify
          mkdir -p release-verify
          if ! gh release download preview-latest \
            --pattern "Mail-Agent-Setup.exe" \
            --dir release-verify \
            --clobber; then
            restore_previous_asset
            exit 1
          fi

          ACTUAL_SHA256=$(sha256sum release-verify/Mail-Agent-Setup.exe | awk '{print $1}')
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "Published installer SHA-256 mismatch."
            restore_previous_asset
            exit 1
          fi

          PUBLISHED_DIGEST=""
          for _ in {1..12}; do
            PUBLISHED_DIGEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/preview-latest" \
              --jq '.assets[] | select(.name == "Mail-Agent-Setup.exe") | .digest' || true)
            if [[ "$PUBLISHED_DIGEST" == "sha256:${EXPECTED_SHA256}" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$PUBLISHED_DIGEST" != "sha256:${EXPECTED_SHA256}" ]]; then
            echo "GitHub release feed does not expose the expected installer digest."
            restore_previous_asset
            exit 1
          fi

          gh release edit preview-latest \
            --title "MAIL-AGENT Preview v${VERSION}" \
            --prerelease \
            --notes "$NOTES"

          git tag -f preview-latest "$GITHUB_SHA"
          git push origin refs/tags/preview-latest --force
          REMOTE_SHA=$(git ls-remote origin refs/tags/preview-latest | awk '{print $1}')
          if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo "preview-latest does not point at the current main commit."
            exit 1
          fi

          echo "Verified preview release v${VERSION}: ${EXPECTED_SHA256}"

  standalone:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Mail-Agent-Linux
          - os: macos-latest
            artifact: Mail-Agent-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" pyinstaller
      - name: Sync packaged app version
        shell: python
        run: |
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          for target_name in (
              "apps/launcher/mail_agent_launcher/main.py",
              "apps/gateway/mail_agent_gateway/main.py",
          ):
              target = Path(target_name)
              text = target.read_text(encoding="utf-8")
              text, count = re.subn(
                  r'^APP_VERSION = "[^"]+"$',
                  f'APP_VERSION = "{version}"',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Could not synchronize APP_VERSION in {target_name}")
              target.write_text(text, encoding="utf-8")
          identity = Path("packages/agent_core/mail_agent_core/identity.py").read_text(encoding="utf-8")
          if f'app_version: str = "{version}"' not in identity:
              raise SystemExit("Agent identity version does not match pyproject.toml")
          desktop = Path("apps/web/desktop-links.js").read_text(encoding="utf-8")
          if f"const APP_VERSION = '{version}'" not in desktop:
              raise SystemExit("Desktop UI version does not match pyproject.toml")
          print(f"Packaging MAIL-AGENT {version}")
      - name: Embed OAuth desktop client overrides
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID || secrets.MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          target = Path("apps/gateway/mail_agent_gateway/oauth_defaults.py")
          text = target.read_text(encoding="utf-8")
          overrides = {
              "GOOGLE_CLIENT_ID": os.environ.get("GOOGLE_OAUTH_CLIENT_ID", "").strip(),
              "MICROSOFT_CLIENT_ID": os.environ.get("MICROSOFT_OAUTH_CLIENT_ID", "").strip(),
          }
          for name, value in overrides.items():
              if not value:
                  continue
              text, count = re.subn(
                  rf'^{name} = .+$',
                  f'{name} = {value!r}',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Could not embed {name}")
              print(f"Using CI-provided {name}.")
          target.write_text(text, encoding="utf-8")
          PY
      - name: Validate embedded OAuth defaults
        run: |
          python - <<'PY'
          import py_compile
          import runpy

          path = "apps/gateway/mail_agent_gateway/oauth_defaults.py"
          py_compile.compile(path, doraise=True)
          defaults = runpy.run_path(path)
          google_client_id = defaults.get("GOOGLE_CLIENT_ID", "")
          microsoft_client_id = defaults.get("MICROSOFT_CLIENT_ID", "")
          if not google_client_id.endswith(".apps.googleusercontent.com"):
            raise SystemExit("A valid Google OAuth desktop client ID is required for release builds")
          print("Google OAuth desktop client configured.")
          if microsoft_client_id:
            print("Microsoft OAuth public client configured.")
          else:
            print("Microsoft OAuth public client not embedded; Microsoft UI stays unavailable.")
          PY
      - name: Run tests
        run: python -m pytest -q
      - name: Validate source and frontend syntax
        run: |
          python -m compileall -q apps packages connectors tests
          node --check apps/web/app.js
          node --check apps/web/llm-model-settings-v2.js
          node --check apps/web/desktop-links.js
          git diff --check
      - name: Build standalone app
        run: >-
          pyinstaller --noconfirm --clean --onefile
          --name Mail-Agent
          --paths apps/launcher --paths apps/gateway --paths apps/registry --paths packages/agent_core
          --paths connectors/imap --paths connectors/google --paths connectors/microsoft
          --add-data "apps/web:mail_agent_web"
          apps/launcher/mail_agent_launcher_entry.py
      - name: Smoke test standalone app
        run: ./dist/Mail-Agent --help >/dev/null
      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/Mail-Agent-Linux-x64.tar.gz Mail-Agent
      - name: Package macOS binary
        if: runner.os == 'macOS'
        run: ditto -c -k dist/Mail-Agent dist/Mail-Agent-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Mail-Agent-Linux-x64.tar.gz
            dist/Mail-Agent-macOS.zip
          if-no-files-found: ignore

  tag-version:
    if: github.ref == 'refs/heads/main'
    needs: [windows, standalone]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag verified version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "MAIL-AGENT ${TAG}"
          git push origin "refs/tags/${TAG}"

  publish-current-version:
    if: github.ref == 'refs/heads/main'
    needs: [windows, standalone, tag-version]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Mail-Agent-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified main build
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v${VERSION}"
          EXPECTED=(
            Mail-Agent-Setup.exe
            Mail-Agent-Linux-x64.tar.gz
            Mail-Agent-macOS.zip
          )

          for ASSET in "${EXPECTED[@]}"; do
            test -f "release-assets/${ASSET}"
          done

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --verify-tag \
              --title "MAIL-AGENT ${TAG}" \
              --generate-notes
          fi

          COMPLETE=true
          for ASSET in "${EXPECTED[@]}"; do
            if ! gh release view "${TAG}" --json assets \
              --jq '.assets[].name' | grep -Fxq "${ASSET}"; then
              COMPLETE=false
            fi
          done
          if [[ "${COMPLETE}" == "true" ]]; then
            echo "${TAG} already contains every verified installer."
            exit 0
          fi

          gh release upload "${TAG}" release-assets/* --clobber
          for ASSET in "${EXPECTED[@]}"; do
            gh release view "${TAG}" --json assets \
              --jq '.assets[].name' | grep -Fxq "${ASSET}"
          done
          echo "Published and verified ${TAG} with ${#EXPECTED[@]} installers."

  publish-version:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, standalone]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Mail-Agent-*
          path: release-assets
          merge-multiple: true
      - name: Validate version tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${VERSION}."
            exit 1
          fi
      - name: Publish versioned release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ASSETS < <(find release-assets -maxdepth 1 -type f -print | sort)
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "No release assets were built."
            exit 1
          fi
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "MAIL-AGENT ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
