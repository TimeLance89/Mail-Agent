name: Apply 0.13.8 patch

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attention-auto-mail-handling-0.13.8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python tools/apply_0138_patch.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: attention center and deterministic mail handling"
          git push origin HEAD:feat/attention-auto-mail-handling-0.13.8
