name: Validate Shadow Mode 0.10.0

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/shadow-mode-rule-simulator-0.10.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shadow-mode-rule-simulator-0.10.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic Shadow Mode integration
        run: |
          if [ -f tools/apply_shadow_mode_010.py ]; then
            python tools/apply_shadow_mode_010.py
            python - <<'PY'
          from pathlib import Path

          main = Path("apps/gateway/mail_agent_gateway/main.py")
          text = main.read_text(encoding="utf-8")
          marker = "from dataclasses import asdict\n"
          if "from datetime import UTC, datetime\n" not in text:
              if marker not in text:
                  raise SystemExit("main.py datetime import marker missing")
              text = text.replace(marker, marker + "from datetime import UTC, datetime\n", 1)
          text = text.replace(
              'if not key.startswith("_")\n',
              'if not key.startswith("_") and key != "report"\n',
              1,
          )
          main.write_text(text, encoding="utf-8")

          css = Path("apps/web/agent-settings.css")
          css.write_text(css.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
            rm tools/apply_shadow_mode_010.py
          else
            echo "Shadow integration helper already removed; validating clean product head."
          fi
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate product state
        run: |
          python -m pytest -q
          python -m compileall -q apps packages connectors
          node --check apps/web/app.js
          git diff --check
      - name: Persist tested integration
        run: |
          if git diff --quiet; then
            echo "Nothing to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Shadow Mode and Rule Simulator 0.10.0"
          git push origin HEAD:feat/shadow-mode-rule-simulator-0.10.0
