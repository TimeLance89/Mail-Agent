name: Refine conversation state

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'feature/conversation-intelligence-0.15.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply conversation state edge-case fixes
        run: python tools/fix_conversation_state_edgecases.py
      - name: Validate patch hygiene
        run: git diff --check
      - name: Commit product and regression fixes
        shell: bash
        run: |
          if git diff --quiet -- apps/gateway/mail_agent_gateway/conversation_store.py tests/test_conversation_intelligence.py; then
            echo "No product changes required"
            exit 0
          fi
          git config user.name "mail-agent-ci"
          git config user.email "mail-agent-ci@users.noreply.github.com"
          git add apps/gateway/mail_agent_gateway/conversation_store.py tests/test_conversation_intelligence.py
          git commit -m "fix: conversation follow-up state edge cases"
          git push origin HEAD:${{ github.head_ref }}
