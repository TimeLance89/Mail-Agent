name: Validate agentic 0.4

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    if: github.event.pull_request.head.ref == 'feat/agentic-core-0.4.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agentic-core-0.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate full branch
        run: |
          python -m pytest -q
          python -m compileall -q apps packages connectors
          node --check apps/web/app.js
          git diff --check
