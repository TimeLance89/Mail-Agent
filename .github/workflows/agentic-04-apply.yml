name: Validate agentic 0.4

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main

jobs:
  apply-and-test:
    if: github.event.pull_request.head.ref == 'feat/agentic-core-0.4.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agentic-core-0.4.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic integration
        run: python tools/apply_agentic_04.py
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate full branch
        run: |
          python -m pytest -q
          python -m compileall -q apps packages connectors
          node --check apps/web/app.js
          git diff --check
      - name: Commit integration if changed
        shell: bash
        run: |
          git rm -f tools/apply_agentic_04.py .agentic-04-trigger || true
          if git diff --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire agentic settings and runtime"
          git push origin HEAD:feat/agentic-core-0.4.0
