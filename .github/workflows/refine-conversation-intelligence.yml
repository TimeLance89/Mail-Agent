name: Refine Conversation Intelligence

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'feature/conversation-intelligence-0.15.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply refinements
        run: python tools/refine_conversation_intelligence_015.py
      - name: Validate generated product code
        run: |
          python -m compileall -q apps/gateway packages/agent_core connectors tests
          node --check apps/web/conversation-intelligence-ui.js
          node --check apps/web/workbench-ui.js
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name "MAIL-AGENT CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps packages connectors tests
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix: harden conversation intelligence 0.15"
          git push origin HEAD:${{ github.head_ref }}
