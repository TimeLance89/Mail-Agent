name: Apply approved Workbench design

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'design/high-end-ui-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize approved Workbench product files
        shell: bash
        run: |
          if [ ! -f tools/apply_workbench_bundle.py ]; then
            echo "Workbench product files are already materialized."
            exit 0
          fi
          python tools/apply_workbench_bundle.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --check --cached
          git commit -m "feat(ui): ship MAIL-AGENT Workbench 0.14.0"
          git push origin HEAD:${{ github.head_ref }}
