name: Validate Agent Brain 0.7.0

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/agent-brain-0.7.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-brain-0.7.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize 0.7.0 versions
        shell: python
        run: |
          import re
          from pathlib import Path

          version = "0.7.0"

          replacements = [
              (Path("pyproject.toml"), r'(?m)^version = "[^"]+"$', f'version = "{version}"', "pyproject version"),
              (Path("packaging/windows/MailAgent.iss"), r'(?m)^#define MyAppVersion "[^"]+"$', f'#define MyAppVersion "{version}"', "installer version"),
              (Path("apps/gateway/mail_agent_gateway/main.py"), r'(?m)^APP_VERSION = "[^"]+"$', f'APP_VERSION = "{version}"', "gateway version"),
              (Path("apps/launcher/mail_agent_launcher/main.py"), r'(?m)^APP_VERSION = "[^"]+"$', f'APP_VERSION = "{version}"', "launcher version"),
              (Path("packages/agent_core/mail_agent_core/identity.py"), r'app_version: str = "[^"]+"', f'app_version: str = "{version}"', "identity version"),
          ]
          for path, pattern, replacement, label in replacements:
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not synchronize {label}: {path}")
              path.write_text(updated, encoding="utf-8")
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate product state
        run: |
          python -m pytest -q
          python -m compileall -q apps packages connectors
          node --check apps/web/app.js
          git diff --check
      - name: Persist version synchronization after green tests
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml packaging/windows/MailAgent.iss apps/gateway/mail_agent_gateway/main.py apps/launcher/mail_agent_launcher/main.py packages/agent_core/mail_agent_core/identity.py
          git commit -m "release: synchronize MAIL-AGENT 0.7.0 versions"
          git push origin HEAD:feat/agent-brain-0.7.0
