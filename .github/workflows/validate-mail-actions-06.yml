name: Validate mail actions 0.6

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/mail-actions-drafts-0.6.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mail-actions-drafts-0.6.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration when pending
        run: |
          if [ -f tools/apply_mail_actions_06.py ]; then
            python tools/apply_mail_actions_06.py
          else
            echo "Integration already persisted"
          fi
          if [ -f tools/fix_mail_actions_06.py ]; then
            python tools/fix_mail_actions_06.py
          fi
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate final product state
        run: |
          python -m pytest -q
          python -m compileall -q apps packages connectors
          node --check apps/web/app.js
          git diff --check
      - name: Persist integration after green tests
        shell: bash
        run: |
          if [ ! -f tools/apply_mail_actions_06.py ] && [ ! -f tools/fix_mail_actions_06.py ]; then
            echo "Nothing to persist"
            exit 0
          fi
          rm -f tools/apply_mail_actions_06.py tools/fix_mail_actions_06.py .mail-actions-06-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire policy-gated mailbox actions and editable drafts"
          git push origin HEAD:feat/mail-actions-drafts-0.6.0
