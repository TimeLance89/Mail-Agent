name: Sync 0.13.9 runtime versions

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mail-provider-presets-0.13.9
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize versions
        run: python tools/sync_0139_versions.py
      - name: Commit source version sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/gateway/mail_agent_gateway/main.py apps/launcher/mail_agent_launcher/main.py
          git diff --cached --check
          git commit -m "chore: synchronize 0.13.9 runtime versions"
          git push origin HEAD:feat/mail-provider-presets-0.13.9
