name: One-shot Gmail auth branch builder

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-gmail-auth-to-branch.yml']

# Triggered after the workflow already exists on the default branch.
jobs:
  build-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gmail-auth
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Gmail feature patches
        run: |
          git apply .github/patches/gmail-core.patch
          git apply .github/patches/gmail-app.patch
          git apply .github/patches/gmail-styles.patch
          git apply .github/patches/gmail-misc.patch
      - name: Finalize 0.2.4
        shell: python
        run: |
          from pathlib import Path
          for path, old, new in [
              ('pyproject.toml', 'version = "0.2.3"', 'version = "0.2.4"'),
              ('packaging/windows/MailAgent.iss', '#define MyAppVersion "0.2.3"', '#define MyAppVersion "0.2.4"'),
              ('apps/launcher/mail_agent_launcher/main.py', 'APP_VERSION = "0.2.3"', 'APP_VERSION = "0.2.4"'),
          ]:
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'Missing marker in {path}: {old}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('.github/workflows/build-installers.yml'); text=p.read_text(encoding='utf-8')
          win='''      - name: Install build dependencies
        run: python -m pip install -e . pyinstaller
'''
          win2='''      - name: Install build dependencies
        run: python -m pip install -e ".[dev]" pyinstaller
      - name: Embed Google OAuth desktop client
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          $clientId = $env:GOOGLE_OAUTH_CLIENT_ID
          $content = @"
          \"\"\"Build-time OAuth defaults. Environment variables override these values.\"\"\"

          GOOGLE_CLIENT_ID = \"$clientId\"
          "@
          Set-Content -Path "apps/gateway/mail_agent_gateway/oauth_defaults.py" -Value $content -Encoding utf8
          if ([string]::IsNullOrWhiteSpace($clientId)) { Write-Warning "GOOGLE_OAUTH_CLIENT_ID is not configured; Gmail OAuth will be disabled in this build." }
      - name: Run tests
        run: python -m pytest -q
'''
          if win not in text: raise SystemExit('Windows installer workflow marker missing')
          text=text.replace(win,win2,1)
          old='''      - run: python -m pip install -e . pyinstaller
'''
          new='''      - run: python -m pip install -e ".[dev]" pyinstaller
      - name: Embed Google OAuth desktop client
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          cid=os.environ.get("GOOGLE_OAUTH_CLIENT_ID","")
          Path("apps/gateway/mail_agent_gateway/oauth_defaults.py").write_text('"""Build-time OAuth defaults. Environment variables override these values."""\\n\\n'+f'GOOGLE_CLIENT_ID = {cid!r}\\n',encoding="utf-8")
          PY
      - name: Run tests
        run: python -m pytest -q
'''
          if old not in text: raise SystemExit('Standalone installer workflow marker missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
      - name: Validate Gmail feature
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python -m compileall -q apps packages connectors
          node --check apps/web/app.js
          git diff --check
      - name: Clean staging files and commit feature
        run: |
          rm -rf .github/patches
          rm -f .github/workflows/apply-gmail-auth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Gmail OAuth and API sync"
          git push origin HEAD:agent/gmail-auth
