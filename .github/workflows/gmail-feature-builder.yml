name: Finalize Gmail auth feature branch

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/patches/gmail-*.patch'
      - '.github/workflows/apply-gmail-auth.yml'

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/gmail-auth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Gmail feature
        run: |
          git apply .github/patches/gmail-core.patch
          git apply .github/patches/gmail-app.patch
          git apply .github/patches/gmail-styles.patch
          git apply .github/patches/gmail-misc.patch
          git apply .github/patches/gmail-build.patch
      - name: Bump product version
        shell: python
        run: |
          from pathlib import Path
          changes = [
              ('pyproject.toml', 'version = "0.2.3"', 'version = "0.2.4"'),
              ('packaging/windows/MailAgent.iss', '#define MyAppVersion "0.2.3"', '#define MyAppVersion "0.2.4"'),
              ('apps/launcher/mail_agent_launcher/main.py', 'APP_VERSION = "0.2.3"', 'APP_VERSION = "0.2.4"'),
          ]
          for name, old, new in changes:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing version marker in {name}: {old}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Validate Gmail feature
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python -m compileall -q apps packages connectors
          node --check apps/web/app.js
          git diff --check
      - name: Replace staging files with finalized feature
        run: |
          rm -rf .github/patches
          rm -f .github/workflows/apply-gmail-auth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Gmail OAuth and API sync"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
