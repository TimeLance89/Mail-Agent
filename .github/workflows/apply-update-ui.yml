name: Apply update UI patch

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/update-settings-ui-0.3.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/update-settings-ui-0.3.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic product changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one marker in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          app = "apps/web/app.js"
          replace_once(
              app,
              "let mailboxId = null;\nlet mailboxConnector = null;",
              "let mailboxId = null;\nlet updateStatus = null;\nlet updateLoading = false;\nlet mailboxConnector = null;",
          )
          replace_once(app, "MAIL-AGENT v0.2.4 · Lokales Gateway", "MAIL-AGENT v0.3.0 · Lokales Gateway")
          replace_once(
              app,
              "app.innerHTML=dashboardLayout(content); bindDashboard();",
              "app.innerHTML=dashboardLayout(content); if(activeView==='settings')renderUpdatePanel(); bindDashboard();",
          )
          update_ui = r'''
          function renderUpdatePanel(){
            const grid=document.querySelector('.settings-grid');
            if(!grid)return;
            const current=updateStatus?.current_version||'0.3.0';
            const available=!!updateStatus?.available;
            const error=updateStatus?.error||'';
            const headline=available?`Version ${esc(updateStatus.latest_version)} verfügbar`:error?'Update-Kanal nicht erreichbar':'Du bist auf dem neuesten Stand';
            const detail=error?esc(error):available?'Der Installer wird über HTTPS geladen, per SHA-256 geprüft und über die bestehende Installation installiert.':'MAIL-AGENT prüft im Hintergrund automatisch auf neue Releases.';
            grid.insertAdjacentHTML('beforeend',`<section class="panel update-panel"><div class="panel-head"><div><span>SOFTWARE & UPDATES</span><h3>MAIL-AGENT aktualisieren</h3></div><span class="badge soft">v${esc(current)}</span></div><div class="setting-row"><span>Installierte Version</span><b>${esc(current)}</b></div><div class="setting-row"><span>Update-Kanal</span><b>${esc(updateStatus?.channel||'Preview')}</b></div><div class="setting-row"><span>Automatische Prüfung</span><b>${updateStatus?.automatic_checks===false?'Aus':'Aktiv · alle 6 Stunden'}</b></div><div class="security-block">${icon('sync',22)}<div><b>${headline}</b><p>${detail}</p></div></div><div class="inline-actions left"><button class="btn secondary" id="check-update" ${updateLoading?'disabled':''}>${updateLoading?'Prüfe …':'Jetzt nach Updates suchen'}</button>${available?'<button class="btn primary" id="install-update">Update installieren</button>':''}${error?'<button class="btn text" id="open-release">Release-Seite öffnen</button>':''}</div><div class="security-note">${icon('shield',18)}<span>Updates ersetzen nur Programmdateien. Identität, Gmail-Tokens, Einstellungen und lokale Mail-Daten bleiben erhalten.</span></div></section>`);
            if(!updateStatus&&!updateLoading)setTimeout(()=>checkUpdate(true),0);
          }
          async function checkUpdate(silent=false){
            if(updateLoading)return;
            updateLoading=true;
            if(activeView==='settings')render();
            try{
              updateStatus=await get('/v1/system/update');
              if(!silent){
                if(updateStatus.available)showNotice(`MAIL-AGENT ${updateStatus.latest_version} ist verfügbar.`);
                else if(updateStatus.error)showNotice('Automatischer Update-Kanal momentan nicht erreichbar.','error');
                else showNotice('MAIL-AGENT ist aktuell.');
              }
            }catch(e){showNotice(e.message,'error');}
            finally{updateLoading=false;if(activeView==='settings')render();}
          }
          async function installUpdate(){
            try{
              const result=await post('/v1/system/update/install',{});
              if(result.installing)showNotice('Update wird installiert. MAIL-AGENT startet anschließend automatisch neu.');
              else showNotice('MAIL-AGENT ist bereits aktuell.');
            }catch(e){showNotice(e.message,'error');}
          }
          document.addEventListener('click',event=>{
            const button=event.target.closest('#check-update,#install-update,#open-release');
            if(!button)return;
            if(button.id==='check-update')checkUpdate(false);
            if(button.id==='install-update')installUpdate();
            if(button.id==='open-release')window.open(updateStatus?.release_page||'https://github.com/TimeLance89/Mail-Agent/releases/tag/preview-latest','_blank');
          });
          '''
          replace_once(app, "function bindDashboard(){", update_ui + "\nfunction bindDashboard(){")

          gateway = "apps/gateway/mail_agent_gateway/main.py"
          replace_once(gateway, "import os\n", "import os\nimport subprocess\nimport threading\nimport time\n")
          replace_once(
              gateway,
              "from mail_agent_core.providers import CodexCliProvider, OllamaProvider\n",
              "from mail_agent_core.providers import CodexCliProvider, OllamaProvider\nfrom mail_agent_core.update import UpdateClient\n",
          )
          replace_once(
              gateway,
              'app = FastAPI(title="MAIL-AGENT Gateway", version="0.2.4", lifespan=lifespan)',
              '''APP_VERSION = "0.3.0"\nupdate_client = UpdateClient(\n    feed_url=settings.update_feed_url,\n    release_page=settings.update_release_page,\n    token=os.getenv("MAIL_AGENT_UPDATE_TOKEN", "").strip() or None,\n)\n\napp = FastAPI(title="MAIL-AGENT Gateway", version=APP_VERSION, lifespan=lifespan)''',
          )
          replace_once(
              gateway,
              'return {"status": "ok", "service": "mail-agent-gateway", "version": "0.2.4"}',
              'return {"status": "ok", "service": "mail-agent-gateway", "version": APP_VERSION}',
          )
          update_api = r'''
          @app.get("/v1/system/update")
          async def system_update_status() -> dict:
              info = await asyncio.to_thread(update_client.check, APP_VERSION)
              result = info.public()
              result.update(
                  {
                      "channel": "Preview",
                      "automatic_checks": True,
                      "check_interval_seconds": 21600,
                  }
              )
              return result


          def _terminate_for_update(delay: float = 1.5) -> None:
              time.sleep(delay)
              os._exit(0)


          @app.post("/v1/system/update/install")
          async def install_system_update() -> dict:
              if os.name != "nt":
                  raise HTTPException(
                      status_code=409,
                      detail="Automatische Installation ist aktuell nur unter Windows verfügbar",
                  )
              info = await asyncio.to_thread(update_client.check, APP_VERSION)
              if info.error:
                  raise HTTPException(
                      status_code=503,
                      detail=f"Der automatische Update-Kanal ist momentan nicht erreichbar: {info.error}",
                  )
              if not info.available:
                  return {"installing": False, "up_to_date": True, "version": APP_VERSION}
              try:
                  updates_dir = settings.data_dir.parent / "updates"
                  updates_dir.mkdir(parents=True, exist_ok=True)
                  installer = updates_dir / f"Mail-Agent-Setup-{info.latest_version}.exe"
                  installer = await asyncio.to_thread(update_client.download, info, installer)
                  helper = installer.with_name("apply-mail-agent-update.cmd")
                  helper.write_text(
                      "@echo off\\r\\n"
                      "timeout /t 2 /nobreak >nul\\r\\n"
                      f'"{installer}" /SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CLOSEAPPLICATIONS\\r\\n'
                      'del "%~f0" >nul 2>&1\\r\\n',
                      encoding="utf-8",
                  )
                  subprocess.Popen(
                      [os.environ.get("COMSPEC", "cmd.exe"), "/d", "/c", str(helper)],
                      close_fds=True,
                      creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0),
                  )
              except Exception as exc:
                  raise HTTPException(status_code=502, detail=f"Update konnte nicht gestartet werden: {exc}") from exc
              threading.Thread(
                  target=_terminate_for_update,
                  daemon=True,
                  name="mail-agent-update-exit",
              ).start()
              return {"installing": True, "latest_version": info.latest_version}


          '''
          replace_once(gateway, '@app.post("/v1/providers/probe")', update_api + '@app.post("/v1/providers/probe")')

          replace_once("apps/launcher/mail_agent_launcher/main.py", 'APP_VERSION = "0.2.9"', 'APP_VERSION = "0.3.0"')
          replace_once("pyproject.toml", 'version = "0.2.9"', 'version = "0.3.0"')
          replace_once("packaging/windows/MailAgent.iss", '#define MyAppVersion "0.2.9"', '#define MyAppVersion "0.3.0"')

          Path("tests/test_update_api.py").write_text(
              '''from __future__ import annotations\n\nimport asyncio\n\nimport mail_agent_gateway.main as gateway\n\n\nclass FakeUpdateInfo:\n    def public(self):\n        return {\n            "current_version": gateway.APP_VERSION,\n            "latest_version": "0.3.1",\n            "available": True,\n            "installer_url": "https://example.test/Mail-Agent-Setup.exe",\n            "expected_sha256": "a" * 64,\n            "installer_size": 150_000,\n            "release_page": "https://example.test/release",\n            "error": None,\n        }\n\n\ndef test_update_status_exposes_web_ui_metadata(monkeypatch):\n    monkeypatch.setattr(gateway.update_client, "check", lambda _version: FakeUpdateInfo())\n    result = asyncio.run(gateway.system_update_status())\n    assert result["current_version"] == "0.3.0"\n    assert result["available"] is True\n    assert result["channel"] == "Preview"\n    assert result["automatic_checks"] is True\n    assert result["check_interval_seconds"] == 21600\n''',
              encoding="utf-8",
          )
          PY
          git rm -f .mail-agent-update-ui.patch .apply-update-ui-trigger || true
          git add apps/web/app.js apps/gateway/mail_agent_gateway/main.py apps/launcher/mail_agent_launcher/main.py pyproject.toml packaging/windows/MailAgent.iss tests/test_update_api.py
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate
        run: |
          python -m pytest -q
          python -m compileall -q apps packages connectors
          node --check apps/web/app.js
          git diff --cached --check
      - name: Commit tested branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: expose in-app update controls"
          git push origin HEAD:feat/update-settings-ui-0.3.0
