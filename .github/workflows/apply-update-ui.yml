name: Apply update UI patch

permissions:
  contents: write

on:
  push:
    branches:
      - feat/update-settings-ui-0.3.0

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-update-ui]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/update-settings-ui-0.3.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply product patch
        run: |
          git apply --index .mail-agent-update-ui.patch
          git rm .mail-agent-update-ui.patch
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate
        run: |
          python -m pytest -q
          python -m compileall -q apps packages connectors
          node --check apps/web/app.js
          git diff --cached --check
      - name: Commit tested branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: expose in-app update controls"
          git push origin HEAD:feat/update-settings-ui-0.3.0
